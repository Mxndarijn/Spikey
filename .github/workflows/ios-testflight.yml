name: iOS TestFlight

# Manual trigger plus `v*` tags: TestFlight builds use macOS-runner minutes (10x multiplier on
# private repos) and need the signing secrets configured first. Run from the Actions tab ->
# "Run workflow".
#
# Split across jobs to keep macOS time short:
#   * check (Linux) runs the test suite.
#   * export (Linux) runs Godot's iOS export with "Export Project Only", which writes a ready
#     Xcode project (Godot does this on any OS), and uploads it as an artifact.
#   * testflight (macOS) only does what needs a Mac: signing, xcodebuild and the upload, via
#     fastlane (see .github/ios/fastlane/Fastfile).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  GODOT_VERSION: 4.6-beta2
  # Keep in sync with application/bundle_identifier in export_presets.cfg.
  IOS_BUNDLE_ID: com.mxndarijn.spikey

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  export:
    name: Export Xcode project
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The build number is the commit count, so the full history has to be here.
          fetch-depth: 0

      - name: Require the Apple team id
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::The APPLE_TEAM_ID secret is not set (see docs/CI.md)." >&2
            exit 1
          fi

      - name: Derive the version
        id: version
        run: |
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)" >> "$GITHUB_OUTPUT"

      - name: Stamp version, team id and bundle id into the export presets
        # The build number must be unique and increasing for TestFlight; the commit count is.
        run: |
          sed -i \
            -e 's/^application\/version=.*/application\/version="${{ steps.version.outputs.build }}"/' \
            -e 's/^application\/short_version=.*/application\/short_version="${{ steps.version.outputs.version }}"/' \
            -e "s/^application\/app_store_team_id=.*/application\/app_store_team_id=\"$APPLE_TEAM_ID\"/" \
            -e 's/^application\/bundle_identifier=.*/application\/bundle_identifier="${{ env.IOS_BUNDLE_ID }}"/' \
            export_presets.cfg
          grep -E '^application/(version|short_version|bundle_identifier)=' export_presets.cfg

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: 'true'

      - name: Write the Supabase config (leaderboards)
        # Optional: with the SUPABASE_URL and SUPABASE_ANON_KEY secrets set, the build uses the
        # friends' leaderboards (docs/LEADERBOARD_SETUP.md); without them, sample boards.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf '{"url": "%s", "anon_key": "%s"}\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" \
              > services/supabase_config.json
            echo "Leaderboards: Supabase"
          else
            echo "::notice::No SUPABASE_URL / SUPABASE_ANON_KEY secrets, so this build shows sample leaderboards."
          fi

      - name: Import project
        run: godot --headless --path . --import || godot --headless --path . --import

      - name: Export Xcode project
        # Godot warns ".ipa can only be built on macOS" and leaves the Xcode project; that is
        # what we want here.
        run: |
          mkdir -p build/ios
          godot --headless --path . --export-release "iOS" build/ios/Flapjaw.ipa
          test -d build/ios/Flapjaw.xcodeproj

      - name: Remove alpha from the app icons
        # App Store Connect rejects an app icon with transparency, and Godot renders the
        # rounded icon.svg with transparent corners. iOS masks the corners anyway, so filling
        # them with the cage colour is invisible on device.
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          import glob
          from PIL import Image
          for path in glob.glob("build/ios/Flapjaw/Images.xcassets/AppIcon.appiconset/*.png"):
              img = Image.open(path).convert("RGBA")
              bg = Image.new("RGBA", img.size, (0x2B, 0x1B, 0x5C, 255))
              bg.alpha_composite(img)
              bg.convert("RGB").save(path)
          EOF

      - name: Pack the Xcode project
        run: tar -czf xcode-project.tar.gz -C build ios

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tar.gz
          if-no-files-found: error
          retention-days: 1

  testflight:
    name: Build & upload to TestFlight
    needs: export
    # macOS is required to build iOS. Apple requires the iOS 26 SDK (Xcode 26) for App Store
    # Connect uploads since 2026-04-28; bump the image if latest-stable resolves lower.
    runs-on: macos-15
    # Hard cap on the expensive macOS runner. Godot links one large static library, so this
    # is higher than a typical small app; raise it if a clean build needs longer.
    timeout-minutes: 25

    env:
      # Read by .github/ios/fastlane/Fastfile.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      XCODE_PROJECT: ${{ github.workspace }}/build/ios/Flapjaw.xcodeproj
      SIGNING_DIR: ${{ github.workspace }}/signing

    steps:
      - name: Checkout repository
        # Only for the fastlane files under .github/ios.
        uses: actions/checkout@v4

      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Unpack Xcode project
        run: |
          mkdir -p build
          tar -xzf xcode-project.tar.gz -C build
          rm xcode-project.tar.gz

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: .github/ios

      - name: Decode signing assets
        run: |
          mkdir -p "$SIGNING_DIR"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$SIGNING_DIR/dist_cert.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$SIGNING_DIR/AppStore.mobileprovision"
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Build & upload to TestFlight
        run: bundle exec fastlane beta
        working-directory: .github/ios

      - name: Keep the IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flapjaw-${{ needs.export.outputs.version }}-${{ needs.export.outputs.build }}-ipa
          path: .github/ios/output/*.ipa
          retention-days: 7

      - name: Read the commit message
        id: commit
        run: |
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Announce on Discord
        # Optional, same DISCORD_WEBHOOK_URL secret as the Android workflow. No file: an IPA
        # only installs through TestFlight.
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        uses: ./.github/actions/discord-embed
        with:
          webhook: ${{ env.DISCORD_WEBHOOK_URL }}
          # iOS blue.
          color: '3447003'
          title: '🍎 Flapjaw ${{ needs.export.outputs.version }} (${{ needs.export.outputs.build }}) for iOS'
          url: https://appstoreconnect.apple.com/apps
          description: |
            **Uploaded to TestFlight.** It shows up in the TestFlight app once Apple finishes processing (usually 5 to 30 minutes).
            > ${{ steps.commit.outputs.subject }}
          fields: |
            Type|${{ startsWith(github.ref, 'refs/tags/v') && '🚀 Release' || '🧪 Test build' }}
            Install|TestFlight app on iPhone
            Commit|[`${{ steps.commit.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

      - name: Clean up signing assets
        if: always()
        run: rm -rf "$SIGNING_DIR"
