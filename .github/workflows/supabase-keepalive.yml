name: Keep Supabase awake

# Supabase's free plan pauses a project after 7 days without requests. This calls the
# leaderboard database's ping() function twice a week so the friends' boards stay up.
# Needs the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets (docs/LEADERBOARD_SETUP.md);
# without them it does nothing.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping the leaderboard database
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::No SUPABASE_URL / SUPABASE_ANON_KEY secrets, nothing to keep awake."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}'
