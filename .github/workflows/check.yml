name: Check

# The Linux version of tools/check.ps1: lint + format, headless import, load every script
# and scene, the full test suite (unit, sim purity, golden replays, bot runs), then the
# FastSim parity check (the C# copy of sim/ in tools/fastsim must match it tick for tick)
# and the bot-heavy tests on FastSim (tools/fastsim/Checks.cs).
# Runs on its own for pushes and pull requests, and next to the builds in the Android and
# iOS workflows: they build while this runs, and nothing is released, uploaded to
# TestFlight or announced unless it passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  # Must match the editor used locally (tools/godot_path.txt). Change it in all three
  # workflow files together.
  GODOT_VERSION: 4.7.2-stable

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint and format check
        run: |
          pip install --quiet "gdtoolkit==4.*"
          dirs=""
          for d in sim game meta services tests tools server; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          gdlint $dirs
          gdformat --check --line-length 100 $dirs

      - name: Import
        # A clean checkout has no .godot/ cache yet. The first pass can trip over class names
        # it has not registered yet, so retry once; a second failure is a real error.
        run: godot --headless --path . --import || godot --headless --path . --import

      - name: Load all scripts and scenes
        run: godot --headless --path . -s res://tools/ci/load_all.gd

      - name: Tests
        # Side by side, one headless Godot per core (tests/run_tests.gd).
        run: godot --headless --path . -s res://tests/run_tests.gd -- --jobs "$(nproc)"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: FastSim parity
        shell: pwsh
        run: |
          $env:GODOT = (Get-Command godot).Source
          ./tools/fastsim.ps1 -Mode parity -Quick -Jobs 4 -Priority Normal
          exit $LASTEXITCODE

      - name: FastSim checks
        # Every variant passable, the portal reaction benchmark, the points cap,
        # revives and Double Trouble pairs (their GD tests above keep a sample).
        shell: pwsh
        run: |
          ./tools/fastsim.ps1 -Mode check -Jobs "$(nproc)" -Priority Normal
          exit $LASTEXITCODE
