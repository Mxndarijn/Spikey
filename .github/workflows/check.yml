name: Check

# The Linux version of tools/check.ps1: lint + format, headless import, load every script
# and scene, the full test suite (unit, sim purity, golden replays, bot runs), then the
# FastSim-RS parity check (the Rust copy of sim/ in tools/fastsim-rs must match it tick for
# tick) and the bot-heavy tests on FastSim-RS (`fastsim-rs check all`).
# Runs on its own for pushes and pull requests, and is called by the phone builds
# (build.yml): they build while this runs, and nothing is released, uploaded to TestFlight or
# announced unless it passes. A build of a commit that already has a passed (or running) push
# Check uses that one instead of running the tests again.
on:
  push:
    branches: [main]
    # Docs alone change no test. A build of such a commit runs the check itself.
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
  workflow_dispatch:
  workflow_call:

# A new push to a pull request cancels its older, now useless run. Every other run (pushes
# to main, manual, called by the builds) gets a group of its own and is never cancelled.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must match the editor used locally (tools/godot_path.txt). Change it in check.yml,
  # build.yml and verify-runs.yml together.
  GODOT_VERSION: 4.7.2-stable

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint and format check
        run: |
          pip install --quiet "gdtoolkit==4.*"
          dirs=""
          for d in sim game meta services tests tools server; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          gdlint $dirs
          gdformat --check --line-length 100 $dirs

      - name: Import
        # A clean checkout has no .godot/ cache yet. The first pass can trip over class names
        # it has not registered yet, so retry once; a second failure is a real error.
        run: godot --headless --path . --import || godot --headless --path . --import

      - name: Load all scripts and scenes
        run: godot --headless --path . -s res://tools/ci/load_all.gd

      - name: Tests
        # Side by side, one headless Godot per core (tests/run_tests.gd).
        run: godot --headless --path . -s res://tests/run_tests.gd -- --jobs "$(nproc)"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/fastsim-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/fastsim-rs/Cargo.lock', 'tools/fastsim-rs/**/Cargo.toml', 'tools/fastsim-rs/.cargo/config.toml') }}-${{ hashFiles('tools/fastsim-rs/**/*.rs') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('tools/fastsim-rs/Cargo.lock', 'tools/fastsim-rs/**/Cargo.toml', 'tools/fastsim-rs/.cargo/config.toml') }}-

      - name: Build FastSim-RS
        # A portable target instead of .cargo/config.toml's target-cpu=native: the cached
        # build must run on any runner. The sim is integers only, so results do not change.
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2
        shell: pwsh
        run: |
          ./tools/fastsim-rs/build.ps1 -NoSlot
          exit $LASTEXITCODE

      - name: FastSim-RS parity
        # tools/fastsim-rs (the Rust copy of sim/ the bots run on) must match sim/ tick for tick.
        shell: pwsh
        run: |
          $env:GODOT = (Get-Command godot).Source
          ./tools/fastsim-rs/parity.ps1 -Quick -NoBuild -Jobs 4
          exit $LASTEXITCODE

      - name: FastSim-RS checks
        # Every bot test (docs/FASTSIM_RS.md): passable variants, the portal reaction
        # benchmark, the points cap, revives, the room searches, exits, bosses, difficulty.
        run: ./tools/fastsim-rs/target/release/fastsim-rs check all --jobs "$(nproc)"
