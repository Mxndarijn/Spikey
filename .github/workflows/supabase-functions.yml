name: Supabase functions

# Deploys the Edge Functions in supabase/functions whenever that folder
# changes on main, or by hand from the Actions tab:
#   device-key   the sign-in that outlives a reinstall (docs/LEADERBOARD_SETUP.md)
#   send-alerts  Board alerts through Firebase (docs/PUSH_SETUP.md)
# For send-alerts it also hands the function its secrets and tells the
# database where the function lives, so nothing has to be typed into the
# Supabase dashboard.
#
# Secrets. Without the first two nothing is deployed; without the other three
# only device-key is:
#   SUPABASE_ACCESS_TOKEN     Supabase -> Account -> Access Tokens
#   SUPABASE_PROJECT_REF      the id in the project's URL
#   SUPABASE_DB_URL           the same connection string supabase-db.yml uses
#   FIREBASE_SERVICE_ACCOUNT  the whole service account key file from Firebase
#   PUSH_SEND_SECRET          any long random text; only the database and the
#                             function know it
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
    steps:
      - name: Check the secrets
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set, nothing deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ] \
             || [ -z "$PUSH_SEND_SECRET" ]; then
            echo "::notice::Push secrets are not all set, send-alerts not deployed. See docs/PUSH_SETUP.md."
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          # The secret may hold the whole project URL: keep only the id.
          ref="${SUPABASE_PROJECT_REF#https://}"
          ref="${ref#http://}"
          ref="${ref%%.*}"
          ref="${ref%%/*}"
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"

      - name: Checkout repository
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Set up Deno
        if: steps.ready.outputs.ok == 'true'
        uses: denoland/setup-deno@v2

      - name: Test the functions
        if: steps.ready.outputs.ok == 'true'
        run: deno test --no-lock supabase/functions

      - name: Set up the Supabase CLI
        if: steps.ready.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy device-key
        if: steps.ready.outputs.ok == 'true'
        # --no-verify-jwt: the function asks Supabase Auth who the caller is itself
        # (works with both the old and the new JWT signing keys).
        run: supabase functions deploy device-key --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes

      - name: Hand the function its secrets
        if: steps.ready.outputs.ok == 'true' && steps.ready.outputs.push == 'true'
        run: |
          # base64 keeps the key file's quotes and line breaks intact in an env file.
          {
            printf 'FIREBASE_SERVICE_ACCOUNT=%s\n' "$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -w0)"
            printf 'ALERTS_SECRET=%s\n' "$PUSH_SEND_SECRET"
          } > "$RUNNER_TEMP/function.env"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$RUNNER_TEMP/function.env" --yes
          rm -f "$RUNNER_TEMP/function.env"

      - name: Deploy send-alerts
        if: steps.ready.outputs.ok == 'true' && steps.ready.outputs.push == 'true'
        # --no-verify-jwt: the function checks the shared secret itself.
        run: supabase functions deploy send-alerts --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes

      - name: Tell the database where the sender is
        if: steps.ready.outputs.ok == 'true' && steps.ready.outputs.push == 'true'
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/send-alerts"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -v url="$url" -v secret="$PUSH_SEND_SECRET" \
            > /dev/null <<'SQL'
          select public.worker_set_push(:'url', :'secret');
          SQL
