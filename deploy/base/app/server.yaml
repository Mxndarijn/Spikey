# The game server (backend/): migrates the database at start, serves the
# game's operations, checks runs and sends board alerts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flapjaw-server
spec:
  replicas: 1
  # One at a time: the old pod stops before the new one migrates and starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flapjaw-server
  template:
    metadata:
      labels:
        app: flapjaw-server
        db-client: "true"
    spec:
      imagePullSecrets:
        - name: flapjaw-registry
      containers:
        - name: server
          image: flapjaw-server
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flapjaw-env
                  key: DATABASE_URL
            - name: MIN_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: flapjaw-env
                  key: MIN_API_VERSION
                  optional: true
            - name: FIREBASE_SERVICE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: flapjaw-env
                  key: FIREBASE_SERVICE_ACCOUNT
                  optional: true
            - name: TRUST_PROXY
              value: "true"
            # Invite links (backend/src/links.rs). Missing: Android gets the upload key
            # (built in), iOS a 404 until APPLE_APP_ID is set.
            - name: ANDROID_CERT_SHA256
              valueFrom:
                secretKeyRef:
                  name: flapjaw-env
                  key: ANDROID_CERT_SHA256
                  optional: true
            - name: APPLE_APP_ID
              valueFrom:
                secretKeyRef:
                  name: flapjaw-env
                  key: APPLE_APP_ID
                  optional: true
            - name: APP_STORE_ID
              valueFrom:
                secretKeyRef:
                  name: flapjaw-env
                  key: APP_STORE_ID
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flapjaw-server
spec:
  selector:
    app: flapjaw-server
  ports:
    - name: http
      port: 80
      targetPort: http
