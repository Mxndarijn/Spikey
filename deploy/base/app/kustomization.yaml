# The game itself: the server, its Ingress, the Godot check and the Battle bots. Used by the
# base (a VM of Flapjaw's own) and by overlays/platform (the shared platform).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - server.yaml
  - ingress.yaml
  - godot-check.yaml
  - battle-bot.yaml
