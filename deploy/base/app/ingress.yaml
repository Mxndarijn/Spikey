# HTTPS for the API through k3s's Traefik; cert-manager gets the certificate
# from Let's Encrypt. tools/deploy.ps1 sets the host (API_HOST).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flapjaw-server
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - API_HOST
      secretName: flapjaw-tls
  rules:
    - host: API_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flapjaw-server
                port:
                  name: http
