# Headless Godot's word on runs the Rust check rejected (deploy/godot-check/):
# every 10 minutes, and gone again at once when nothing waits, so it holds no
# memory between runs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: godot-check
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: godot-check
            db-client: "true"
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: flapjaw-registry
          containers:
            - name: check
              image: flapjaw-godot-check
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: flapjaw-env
                      key: DATABASE_URL
              resources:
                requests:
                  memory: 128Mi
                  cpu: 50m
                limits:
                  memory: 384Mi
