# Let's Encrypt through Traefik (HTTP-01). tools/deploy.ps1 fills in the email
# from ACME_EMAIL and applies this once cert-manager is up.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
