<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 200 200" role="img" aria-label="Flapjaw: Buzz the Bee at the end of a white zigzag trail, between ceiling and floor spike rows on a sunset sky">
  <title>Flapjaw</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC78E"/>
      <stop offset="0.55" stop-color="#FF8F74"/>
      <stop offset="1" stop-color="#FF8F74"/>
    </linearGradient>
    <clipPath id="buzz-body">
      <ellipse rx="27" ry="21"/>
    </clipPath>
  </defs>

  <!-- Sunset Glow sky and glow -->
  <rect width="200" height="200" fill="url(#sky)"/>
  <circle cx="126" cy="100" r="60" fill="#FFDDB0" opacity=".45"/>

  <!-- Ceiling spikes -->
  <g transform="scale(1.25)">
    <rect width="160" height="8" fill="#2A1740"/>
    <g transform="translate(20 8)"><path d="M-20 0L-2.79 22.3A3 3 0 0 0 2.79 22.3L20 0Z" fill="#2A1740"/><path d="M0 0L0 24.2L20 0Z" fill="#665875" opacity=".55"/></g>
    <g transform="translate(60 8)"><path d="M-20 0L-2.79 22.3A3 3 0 0 0 2.79 22.3L20 0Z" fill="#2A1740"/><path d="M0 0L0 24.2L20 0Z" fill="#665875" opacity=".55"/></g>
    <g transform="translate(100 8)"><path d="M-20 0L-2.79 22.3A3 3 0 0 0 2.79 22.3L20 0Z" fill="#2A1740"/><path d="M0 0L0 24.2L20 0Z" fill="#665875" opacity=".55"/></g>
    <g transform="translate(140 8)"><path d="M-20 0L-2.79 22.3A3 3 0 0 0 2.79 22.3L20 0Z" fill="#2A1740"/><path d="M0 0L0 24.2L20 0Z" fill="#665875" opacity=".55"/></g>
  </g>

  <!-- Floor spikes -->
  <g transform="translate(0 200) scale(1.25 -1.25)">
    <rect width="160" height="8" fill="#2A1740"/>
    <g transform="translate(20 8)"><path d="M-20 0L-2.79 22.3A3 3 0 0 0 2.79 22.3L20 0Z" fill="#2A1740"/><path d="M0 0L0 24.2L20 0Z" fill="#665875" opacity=".55"/></g>
    <g transform="translate(60 8)"><path d="M-20 0L-2.79 22.3A3 3 0 0 0 2.79 22.3L20 0Z" fill="#2A1740"/><path d="M0 0L0 24.2L20 0Z" fill="#665875" opacity=".55"/></g>
    <g transform="translate(100 8)"><path d="M-20 0L-2.79 22.3A3 3 0 0 0 2.79 22.3L20 0Z" fill="#2A1740"/><path d="M0 0L0 24.2L20 0Z" fill="#665875" opacity=".55"/></g>
    <g transform="translate(140 8)"><path d="M-20 0L-2.79 22.3A3 3 0 0 0 2.79 22.3L20 0Z" fill="#2A1740"/><path d="M0 0L0 24.2L20 0Z" fill="#665875" opacity=".55"/></g>
  </g>

  <!-- Bounce trail -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M10 110L38 136" stroke-width="9"/>
    <path d="M38 136L66 84" stroke-width="15"/>
    <path d="M66 84L88 118" stroke-width="20"/>
  </g>

  <!-- Buzz the Bee (from the Flapjaw Design Kit) -->
  <g transform="translate(128 106) rotate(-10) scale(1.25)">
    <g transform="rotate(20 -4 -16)"><ellipse cx="-10" cy="-28" rx="9" ry="15" fill="#E6F6FF" fill-opacity=".85" stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g>
    <path d="M-27 0L-38 4L-27 6Z" fill="#1E1B2E"/>
    <ellipse rx="27" ry="21" fill="#FFC928"/>
    <g clip-path="url(#buzz-body)" fill="#1E1B2E"><rect x="-16" y="-30" width="8" height="60"/><rect x="-2" y="-30" width="8" height="60"/></g>
    <ellipse rx="27" ry="21" fill="none" stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <g transform="rotate(5 4 -16)"><ellipse cx="4" cy="-28" rx="9" ry="15" fill="#E6F6FF" fill-opacity=".85" stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g>
    <path d="M18 -16Q20 -30 30 -32M24 -14Q30 -26 38 -24" fill="none" stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="30" cy="-32" r="3" fill="#1E1B2E"/>
    <circle cx="38" cy="-24" r="3" fill="#1E1B2E"/>
    <circle cx="17" cy="-4" r="6.5" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="18.95" cy="-3.675" r="2.925" fill="#1E1B2E"/>
    <circle cx="19.925" cy="-5.625" r="1.3" fill="#FFFFFF"/>
    <path d="M14 9Q19 13 24 8" fill="none" stroke="#1E1B2E" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
