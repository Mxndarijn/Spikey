[package]
name = "fastsim"
edition.workspace = true
version.workspace = true

[[bin]]
name = "fastsim-rs"
path = "src/main.rs"

[dependencies]
sim = { path = "../sim" }
rayon = "1"
mimalloc = { version = "0.1", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }

[features]
prof = ["sim/prof"]
