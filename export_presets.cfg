; Export presets for Flapjaw. No credentials live here: the Android keystore comes from
; GODOT_ANDROID_KEYSTORE_* environment variables and the iOS signing happens in fastlane
; (see docs/CI.md). To change the app id, edit package/unique_name (Android, presets 0 and 1)
; and application/bundle_identifier (iOS, preset 2). CI stamps version codes and the Apple
; team id into this file at build time; the committed values are local defaults.
; Both Android presets use the Gradle build: the AdMob plugin (addons/admob, rewarded ad
; for the revive) needs it. Only the plugin's runtime scripts are packed (exclude_filter).
; Android ships arm64 only (Play needs 64-bit, 32-bit would double the APK). The APK preset
; compresses its native libraries because that APK is downloaded directly; the AAB doesn't,
; Play compresses downloads itself. CI swaps in a smaller 2D-only engine (tools/engine).
; The Godotx Firebase plugin (addons/godotx_firebase, android/firebase_*) adds Firebase
; core + messaging for Board alerts (docs/PUSH_SETUP.md). CI writes google-services.json.

