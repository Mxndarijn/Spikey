exclude_filter="tests/*, tools/*, docs/*, server/*, addons/admob/assets/*, addons/admob/gdscript/sample/*, addons/admob/csharp/*, addons/admob/docs/*, addons/admob/skills/*, addons/admob/internal/editor/*, addons/admob/internal/mock/*, addons/admob/internal/translations/*, addons/admob/internal/exporters/*, addons/admob/internal/handlers/*, addons/admob/internal/services/*, addons/admob/android/*, addons/admob/ios/*, addons/godotx_firebase/*, android/*, ios/*, google-services.json, GoogleService-Info.plist"
export_path="build/android/Flapjaw.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

